<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AI Помощник">
<title>AI Помощник</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17171a;--muted:#6d6d73;--line:#dedee3;--accent:#007aff;--soft:#e9f2ff}
@media(prefers-color-scheme:dark){:root{--bg:#09090b;--card:#151518;--text:#f5f5f7;--muted:#a1a1a8;--line:#303036;--accent:#0a84ff;--soft:#10233b}}
html[data-theme=light]{--bg:#f5f5f7;--card:#fff;--text:#17171a;--muted:#6d6d73;--line:#dedee3;--accent:#007aff;--soft:#e9f2ff}
html[data-theme=dark]{--bg:#09090b;--card:#151518;--text:#f5f5f7;--muted:#a1a1a8;--line:#303036;--accent:#0a84ff;--soft:#10233b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:30px;margin:0 0 5px;font-weight:800}.sub,.status,footer{color:var(--muted);font-size:13px}
.iconbtn,.btn,.action{cursor:pointer;border:0}.iconbtn{background:var(--card);color:var(--text);width:42px;height:42px;border-radius:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
textarea{width:100%;min-height:150px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font-size:17px;line-height:1.45}
textarea::placeholder{color:var(--muted)}.row{display:flex;gap:9px;flex-wrap:wrap}.btn{border-radius:14px;padding:12px 14px;background:var(--soft);color:var(--text);font-weight:700}.btn.primary{background:var(--accent);color:#fff}.btn.secondary{background:var(--bg)}
.section-title{font-weight:800;margin:4px 2px 10px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.action{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:17px;padding:14px;text-align:left;min-height:78px}.action b{display:block;font-size:15px;margin-bottom:4px}.action span{display:block;color:var(--muted);font-size:12px}
.template{width:100%;text-align:left;margin-bottom:8px}.history{display:flex;flex-direction:column;gap:8px}.history-item{border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}.history-item small{color:var(--muted);display:block;margin-top:4px}.hidden{display:none!important}footer{text-align:center;margin-top:18px;line-height:1.4}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="app">
<header><div><h1>AI Помощник</h1><div class="sub">Подготовь запрос и открой его в ChatGPT</div></div><button class="iconbtn" id="themeBtn" aria-label="Тема">◐</button></header>
<section class="card"><textarea id="input" placeholder="Напиши текст или вопрос…"></textarea><div class="row" style="margin-top:10px">
<button class="btn primary" id="copyBtn">Копировать запрос</button><button class="btn" id="openBtn">Открыть ChatGPT</button><button class="btn secondary" id="clearBtn">Очистить</button></div><div class="status" id="status"></div></section>
<div class="section-title">Быстрые действия</div><section class="grid">
<button class="action" data-action="Объясни простыми словами"><b>💡 Объяснить</b><span>Сделать понятнее</span></button>
<button class="action" data-action="Сократи этот текст, сохранив смысл"><b>✂️ Сократить</b><span>Коротко и по делу</span></button>
<button class="action" data-action="Переведи этот текст на английский язык"><b>🌐 Перевести</b><span>Перевод</span></button>
<button class="action" data-action="Исправь ошибки и улучши текст"><b>✍️ Исправить</b><span>Грамматика и стиль</span></button>
<button class="action" data-action="Помоги решить задачу пошагово и объясни ход решения"><b>📚 Учёба</b><span>Пошагово</span></button>
<button class="action" data-action="Предложи несколько хороших идей и объясни плюсы каждой"><b>💭 Идеи</b><span>Варианты</span></button>
<button class="action" data-action="Помоги написать или исправить код. Объясняй изменения"><b>💻 Код</b><span>Программирование</span></button>
<button class="action" data-action="Сформулируй ясный и полезный ответ на мой вопрос"><b>❓ Разобраться</b><span>Разбор</span></button></section>
<section class="card" style="margin-top:14px"><div class="section-title">Готовые шаблоны</div>
<button class="btn template" data-template="homework">📖 Домашнее задание</button><button class="btn template" data-template="summary">📝 Краткий конспект</button>
<button class="btn template" data-template="plan">🗓️ План действий</button><button class="btn template" data-template="brainstorm">🧠 Мозговой штурм</button></section>
<section class="card"><div class="section-title">Файлы и голос</div><div class="row"><label class="btn" for="fileInput">📎 Выбрать файл</label>
<input id="fileInput" class="hidden" type="file" accept=".txt,.md,.csv,.json,.pdf,image/*"><button class="btn" id="voiceBtn">🎙️ Голос</button></div><div class="status" id="fileStatus"></div></section>
<section class="card"><div class="section-title">История</div><div id="history" class="history"></div><button class="btn secondary" id="historyClear" style="margin-top:10px">Очистить историю</button></section>
<footer>Без API-ключей и паролей. История хранится только локально в браузере.</footer></main>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id),input=$("input"),status=$("status"),fileStatus=$("fileStatus"),historyEl=$("history");
let history=[];try{history=JSON.parse(localStorage.getItem("ai_helper_history")||"[]");if(!Array.isArray(history))history=[]}catch(e){history=[]}
function setStatus(t){status.textContent=t||""}
function renderHistory(){historyEl.innerHTML="";if(!history.length){let e=document.createElement("div");e.className="status";e.textContent="Пока здесь пусто.";historyEl.appendChild(e);return}
history.forEach(item=>{let e=document.createElement("div"),b=document.createElement("b"),s=document.createElement("small");e.className="history-item";b.textContent=item.text.length>90?item.text.slice(0,90)+"…":item.text;s.textContent=item.time||"";e.append(b,s);e.onclick=()=>{input.value=item.text;setStatus("Запрос восстановлен.");scrollTo({top:0,behavior:"smooth"})};historyEl.appendChild(e)})}
function saveHistory(text){if(!text.trim())return;history.unshift({text:text.trim(),time:new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})});history=history.slice(0,20);try{localStorage.setItem("ai_helper_history",JSON.stringify(history))}catch(e){}renderHistory()}
function makePrompt(instruction){return instruction+(input.value.trim()?"\n\n"+input.value.trim():"")}
async function copyText(text){try{await navigator.clipboard.writeText(text);setStatus("Готово — запрос скопирован.")}catch(e){let ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");setStatus("Готово — запрос скопирован.")}catch(x){setStatus("Не удалось скопировать автоматически.")}ta.remove()}}
function openChatGPT(text){saveHistory(text);location.href="https://chatgpt.com/?q="+encodeURIComponent(text)}
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{input.value=makePrompt(b.dataset.action);setStatus("Запрос подготовлен.");input.focus();scrollTo({top:0,behavior:"smooth"})});
const templates={homework:"Помоги мне с домашним заданием. Объясняй каждый шаг простыми словами.",summary:"Сделай краткий и понятный конспект текста ниже. Выдели главные мысли, термины и выводы.",plan:"Составь реалистичный пошаговый план действий. Раздели его на небольшие понятные этапы.",brainstorm:"Проведи мозговой штурм: предложи 10 разных идей, затем выбери 3 наиболее практичные и объясни почему."};
document.querySelectorAll("[data-template]").forEach(b=>b.onclick=()=>{input.value=makePrompt(templates[b.dataset.template]);setStatus("Шаблон добавлен.");input.focus();scrollTo({top:0,behavior:"smooth"})});
$("copyBtn").onclick=()=>{let t=input.value.trim();if(!t){setStatus("Сначала напиши запрос.");return}copyText(t);saveHistory(t)};
$("openBtn").onclick=()=>{let t=input.value.trim();if(!t){setStatus("Сначала напиши запрос.");return}openChatGPT(t)};
$("clearBtn").onclick=()=>{input.value="";setStatus("");fileStatus.textContent="";input.focus()};
$("historyClear").onclick=()=>{history=[];try{localStorage.removeItem("ai_helper_history")}catch(e){}renderHistory();setStatus("История очищена.")};
$("fileInput").onchange=async e=>{let f=e.target.files&&e.target.files[0];if(!f)return;let n=f.name.toLowerCase();if(f.type.startsWith("image/")||n.endsWith(".pdf")){input.value="Проанализируй прикреплённый файл и помоги мне разобраться в нём.";fileStatus.textContent="Выбран "+f.name+". Прикрепи файл уже в ChatGPT после открытия.";return}try{input.value=await f.text();fileStatus.textContent="Текст из файла загружен: "+f.name;setStatus("Файл прочитан.")}catch(e){fileStatus.textContent="Не удалось прочитать этот файл."}};
$("voiceBtn").onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){setStatus("Голосовой ввод недоступен. Используй диктовку iPhone.");return}let r=new R();r.lang="ru-RU";r.interimResults=false;r.maxAlternatives=1;setStatus("Слушаю…");r.onresult=e=>{let t=e.results[0][0].transcript;input.value=input.value.trim()?input.value.trim()+" "+t:t;setStatus("Готово.")};r.onerror=()=>setStatus("Не удалось получить голос. Попробуй ещё раз.");try{r.start()}catch(e){setStatus("Голосовой ввод уже запущен или недоступен.")}};
function applyTheme(m){if(m==="light"||m==="dark")document.documentElement.dataset.theme=m;else document.documentElement.removeAttribute("data-theme");try{localStorage.setItem("ai_helper_theme",m)}catch(e){}}
$("themeBtn").onclick=()=>{let m;try{m=localStorage.getItem("ai_helper_theme")||"auto"}catch(e){m="auto"}let n=m==="auto"?"dark":m==="dark"?"light":"auto";applyTheme(n);setStatus("Тема: "+(n==="auto"?"системная":n==="dark"?"тёмная":"светлая")+".")};
let theme="auto";try{theme=localStorage.getItem("ai_helper_theme")||"auto"}catch(e){}applyTheme(theme);renderHistory()
})();
</script></body></html>
